[Responder Core]

; Servers to start
SQL = On
SMB = On
RDP = On
Kerberos = On
FTP = On
POP = On
SMTP = On
IMAP = On
IMAPS = On
HTTP = On
HTTPS = On
DNS = On
LDAP = On
DCERPC = On
WINRM = On
LLMNR = On
NBTNS = On
MDNS = On
DHCP = Off
DHCPv6 = On

; Session and logging
SessionLog = On
LogToFile = On
Verbose = Yes

; SQLite database and TLS material
Database = Responder.db
SSLCert = certs/responder.crt
SSLKey = certs/responder.key

[HTTP Server]
; Default page served by the rogue HTTP server
HtmlFilename = files/AccessDenied.html

[DHCPv6 Server]
; Only answer DHCPv6 clients matching this domain; empty = no filter
DHCPv6_Domain =
; Send IPv6 Router Advertisements
SendRA = Off
; IPv6 address advertised as the DNS server
BindToIPv6 = fe80::1

[DNS Server]
; Domain filter for poisoning (falls back to DHCPv6_Domain when empty)
DNS_Domain =
; TTL for poisoned records (hex, or `random`)
TTL = 1e
